# دیار — Nginx reverse proxy (diar.life). HTTP redirects to HTTPS.
# Receipts under /uploads/receipts/ are NOT served here — use the authenticated app route.
# TLS cert managed by certbot (Let's Encrypt) at /etc/letsencrypt/live/diar.life/.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name diar.life www.diar.life;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name diar.life www.diar.life;

    ssl_certificate     /etc/letsencrypt/live/diar.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diar.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 3M;

    location /uploads/properties/ {
        alias /var/www/diar/uploads/properties/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
